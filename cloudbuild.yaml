steps:
  - name: gcr.io/cloud-builders/docker
    id: build-combined-roof-doctors
    # Dockerfile RUN --mount instructions require the BuildKit builder.
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --build-arg
      - VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}
      - --build-arg
      - VITE_SUPABASE_PUBLISHABLE_KEY=${_VITE_SUPABASE_PUBLISHABLE_KEY}
      - --tag
      - ${_IMAGE_URI}
      - .
  - name: gcr.io/cloud-builders/docker
    id: push-combined-image
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        docker push "${_IMAGE_URI}"
        # Inspect this build's local image after push, not the mutable remote tag.
        docker image inspect "${_IMAGE_URI}" --format '{{index .RepoDigests 0}}' > /workspace/combined-image-reference.txt
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy-combined-cloud-run
    # Repository consolidation validates source; production cutover stays explicit.
    entrypoint: sh
    args:
      - -c
      - |
        if [ "${_APPROVE_PRODUCTION_DEPLOY}" != "true" ]; then
          echo "Image built; production deployment was not requested."
          exit 0
        fi
        set -eu
        image="$$(cat /workspace/combined-image-reference.txt)"
        repository="$$(printf '%s' '${_IMAGE_URI}' | sed 's/:[^/]*$$//')"
        case "$$image" in
          "$$repository"@sha256:*) ;;
          *) echo "Pushed image repository does not match; refusing deployment." >&2; exit 1 ;;
        esac
        digest="$${image#"$$repository"@sha256:}"
        if [ "$${#digest}" -ne 64 ] || printf '%s' "$$digest" | grep -q '[^0-9a-f]'; then
          echo "Missing or invalid pushed image digest; refusing deployment." >&2
          exit 1
        fi
        exec gcloud run deploy roof-doctors-combined --image "$$image" --no-traffic --region us-east1 --project trdcrd --quiet

images:
  - ${_IMAGE_URI}
substitutions:
  _APPROVE_PRODUCTION_DEPLOY: "false"
  _VITE_SUPABASE_URL: https://gubvelngdohrfvqeeabu.supabase.co
  _VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_o2OYRMRHrl8nz8mLdhX9Mg_Pk3jFz-K
  _IMAGE_URI: us-east1-docker.pkg.dev/trdcrd/roof-doctors/combined:integration
options:
  logging: CLOUD_LOGGING_ONLY
