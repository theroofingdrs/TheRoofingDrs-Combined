steps:
  - name: gcr.io/cloud-builders/docker
    id: build-combined-roof-doctors
    args:
      - build
      - --build-arg
      - VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}
      - --build-arg
      - VITE_SUPABASE_PUBLISHABLE_KEY=${_VITE_SUPABASE_PUBLISHABLE_KEY}
      - --tag
      - ${_IMAGE_URI}
      - .
images:
  - ${_IMAGE_URI}
substitutions:
  _VITE_SUPABASE_URL: https://gubvelngdohrfvqeeabu.supabase.co
  _VITE_SUPABASE_PUBLISHABLE_KEY: REPLACE_WITH_SUPABASE_PUBLISHABLE_KEY
  _IMAGE_URI: us-east1-docker.pkg.dev/$PROJECT_ID/roof-doctors/combined:feature
options:
  logging: CLOUD_LOGGING_ONLY
