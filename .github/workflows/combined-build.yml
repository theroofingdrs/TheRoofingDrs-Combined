name: Combined site build

on:
  push:
    branches:
      - integration/path-routing
  pull_request:
    branches:
      - main

concurrency:
  group: combined-site-ci-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build both websites
        run: npm test
