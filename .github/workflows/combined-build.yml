name: Combined site build

on:
  push:
    branches:
      - release-candidate/combined-site
  pull_request:
    branches:
      - main
      - release-candidate/combined-site

concurrency:
  group: combined-site-ci-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies, build both applications, and run combined smoke tests
        run: npm test
