name: Combined site build

on:
  push:
    branches:
      - integration/path-routing
  pull_request:
    branches:
      - main

concurrency:
  group: combined-site-ci-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build residential website
        working-directory: source-apps/trd
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install and build commercial website
        working-directory: source-apps/crd
        run: |
          npm install --no-audit --no-fund
          npm run build
