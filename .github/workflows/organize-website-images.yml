name: Organize approved website image library

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/organize-website-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved image source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - name: Check out isolated website image branch
        uses: actions/checkout@v4
        with:
          ref: feature/integration-image-library
          path: target
          fetch-depth: 0
      - name: Copy and organize original resolution images
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, json, hashlib
          src = Path("source/image-library/incoming")
          dst = Path("target")
          # Approved image allocation. Originals in image-library/incoming are never changed.
          mapping = [
            ("IMG_3990.jpeg","source-apps/trd/public/assets/images/library/residential-chimney-flashing.jpg","Residential","Roof repair and flashing"),
