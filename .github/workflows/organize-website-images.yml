            "IMG_4012.jpeg": {"tags": ["commercial","flat-roof","roof-coatings","roof-restoration","maintenance","industrial"], "additional_placements": ["Commercial roof coatings","Silicone roof restoration","Warehouse and storage building coatings","Commercial roof maintenance"]},
            "IMG_4037.jpeg": {"tags": ["commercial","roof-replacement","tear-off","reroofing","commercial-flat-roof"], "additional_placements": ["Commercial roof replacement","Large-loss roof recovery","Industrial facility reroofing"]},
