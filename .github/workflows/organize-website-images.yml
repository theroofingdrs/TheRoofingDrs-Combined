              source = src / original
              if not source.exists():
                  raise SystemExit(f"Missing approved source image: {original}")
              target = dst / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              metadata = extra_metadata.get(original, {})
              default_tag = placement.lower().replace('&', 'and').replace('/', '-').replace(' ', '-')
              tags = sorted(set([brand.lower(), default_tag, *metadata.get('tags', [])]))
              manifest.append({
                  "original": f"image-library/incoming/{original}",
                  "website_asset": relative.removeprefix("source-apps/trd/public").removeprefix("source-apps/crd/public"),
                  "brand": brand,
                  "recommended_placement": placement,
                  "tags": tags,
                  "additional_placements": metadata.get("additional_placements", []),
                  "usage_context": "illustrative-unless-verified",
                  "sha256": hashlib.sha256(source.read_bytes()).hexdigest()
              })
          # Ensure the target branch has the manifest directory.
          (dst / "image-library").mkdir(parents=True, exist_ok=True)
          # Exact duplicate: retain IMG_4707 and do not create a second website copy for IMG_4708.
          (dst / "image-library/website-image-map.json").write_text(json.dumps(manifest, indent=2))
          (dst / "image-library/WEBSITE-IMAGE-PLACEMENTS.md").write_text(
              "# Website image placements\n\n"
              "Original uploads remain unchanged in image-library/incoming. The website-ready copies are stored in each brand's public assets/images/library directory.\n\n"
              "## Residential (The ROOF Doctors)\n"
              "Use residential assets for the residential home page, gallery, roof replacement, roof repair, storm damage, inspection, metal roofing and roofing systems pages.\n\n"
              "## Commercial (Commercial ROOF Doctors)\n"
              "Use commercial assets for the commercial home page, commercial roofing overview, coatings and restoration, TPO, EPDM, modified bitumen, metal roofing, inspections, maintenance and replacement pages. Prioritize coatings/restoration content in CRD page imagery.\n\n"
              "## Multi-category reuse\n"
              "Each original is retained once. Use the manifest tags and additional_placements to reuse that same website asset across relevant service, roof-type, building-type and industry pages; do not create a separate image copy for each placement.\n\n"
              "Examples include barn imagery across agricultural reroofing and metal-roof replacement, and warehouse imagery across industrial roofing, storage-building coatings, silicone restoration and maintenance.\n\n"
              "## Visual truth\n"
              "Use these images as illustrative service imagery unless a specific completed customer project is independently verified. Do not imply a named customer, address, project result, testimonial or endorsement from an illustrative image.\n\n"
              "## Exclusions and handling\n"
              "Aqua-branded photos are excluded from website-ready copies pending a clean crop. The exact duplicate IMG_4708 is omitted; IMG_4707 is retained. The three previously identified deletion candidates remain in the incoming archive and are not copied to website assets.\n\n"
              "Use these images as illustrative roofing/service imagery unless a specific completed customer project is independently verified. Do not imply a customer relationship, address, project result, testimonial or endorsement from an image alone.\n"
          )
          print(f"Copied {len(manifest)} original-resolution images.")
          PY
      - name: Commit website assets to feature branch only
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-apps/trd/public/assets/images/library source-apps/crd/public/assets/images/library image-library/website-image-map.json image-library/WEBSITE-IMAGE-PLACEMENTS.md
          git commit -m "Organize approved roofing website image assets"
          git push origin HEAD:feature/integration-image-library
